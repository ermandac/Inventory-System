<div class="orders-container">
  <div class="orders-header">
    <h2>Order Management</h2>
    <button 
      *ngIf="canCreateOrder"
      mat-raised-button 
      color="primary" 
      (click)="openCreateOrderDialog()">
      <mat-icon>add</mat-icon> Create Order
    </button>
  </div>

  <mat-form-field>
    <input matInput (keyup)="applyFilter($event)" placeholder="Filter orders">
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <!-- Order Number Column -->
    <ng-container matColumnDef="orderNumber">
      <th mat-header-cell *matHeaderCellDef>Order Number</th>
      <td mat-cell *matCellDef="let order">{{ order.orderNumber }}</td>
    </ng-container>

    <!-- Customer Column -->
    <ng-container matColumnDef="customer">
      <th mat-header-cell *matHeaderCellDef>Customer</th>
      <td mat-cell *matCellDef="let order">{{ order.customer }}</td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let order">
        <span class="status-chip" [ngClass]="order.status">
          {{ getOrderStatusLabel(order.status) }}
        </span>
      </td>
    </ng-container>

    <!-- Order Date Column -->
    <ng-container matColumnDef="orderDate">
      <th mat-header-cell *matHeaderCellDef>Order Date</th>
      <td mat-cell *matCellDef="let order">{{ order.orderDate | date:'mediumDate' }}</td>
    </ng-container>

    <!-- Total Value Column -->
    <ng-container matColumnDef="totalValue">
      <th mat-header-cell *matHeaderCellDef>Total Value</th>
      <td mat-cell *matCellDef="let order">{{ order.totalValue | currency }}</td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let order">
        <button 
          *ngIf="(canUpdateStatus(order) | async)"
          mat-icon-button 
          color="primary" 
          (click)="updateOrderStatus(order)">
          <mat-icon>edit</mat-icon>
        </button>
        
        <button 
          *ngIf="(canUpdateStatus(order) | async)"
          mat-icon-button 
          color="primary" 
          (click)="viewOrderDetails(order._id)">
          <mat-icon>visibility</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- No data row -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="6">
        No data matching the filter
      </td>
    </tr>
  </table>

  <mat-paginator 
    [pageSizeOptions]="[5, 10, 25, 100]" 
    [pageSize]="10"
    showFirstLastButtons
    aria-label="Select page of orders">
  </mat-paginator>
</div>
